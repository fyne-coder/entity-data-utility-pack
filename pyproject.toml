[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "er-reviewer"
version = "0.1.0"
description = "Generic CSV and entity-resolution data review utilities."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
analysis = [
  "pandas",
  "scikit-learn",
  "rapidfuzz",
  "tqdm",
]
tables = [
  "pandas",
  "openpyxl",
  "pyarrow",
]
reports = [
  "openpyxl",
  "weasyprint",
]
dev = [
  "mypy",
  "pytest",
  "ruff",
]

[project.scripts]
er-review = "er_reviewer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["src", "tests", "scripts"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_return_any = true
no_implicit_optional = true
